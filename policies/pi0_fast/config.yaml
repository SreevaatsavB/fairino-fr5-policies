# π0-FAST — autoregressive VLA (FAST action tokenisation, no ODE steps).
# ⚠️  REQUIRES PALIGEMMA WEIGHTS (~5 GB, gated HuggingFace download):
#     huggingface-cli login
#     # accept licence: https://huggingface.co/google/paligemma-3b-pt-224
#     Also downloads lerobot/fast-action-tokenizer (public, small).
# Run from repo root:
#     python common/train.py --policy pi0_fast
#
# Key difference from pi0/pi05: NO flow-matching ODE. Actions are VQ-tokenised
# and generated autoregressively — single forward pass, much faster inference.

dataset:
  root: "../so101-fr5-teleop/lerobot_dataset"
  chunk_size: 50
  use_image: true
  camera_names: [wrist_cam, scene_cam]   # wrist + scene
  image_size: [224, 224]
  val_frac: 0.1
  aug_level: "crops"

model:
  state_dim: 7
  action_dim: 7
  max_state_dim: 32
  max_action_dim: 32
  tokenizer_max_length: 200
  # inference smoothing (no effect on training/weights; override at deploy via
  # deploy.py --n-action-steps). Execute the first k of each chunk then re-plan
  # (receding horizon); null = execute the whole chunk (most open-loop, jerkiest at
  # the ~1.67 s boundary). This is the right smoothing for the VLAs — NOT temporal
  # ensembling, which re-predicts every 33 ms step and blows the 30 Hz budget on a 2.3B VLM.
  n_action_steps: null

  # π0-FAST pretrained weights — REQUIRED for finetuning. PI0FastPolicy(config)
  # random-inits the whole model; only loading this checkpoint gives real weights.
  # "lerobot/pi0fast_base" is the openpi port (gated). Set null for smoke tests only.
  pretrained: "lerobot/pi0fast_base"

  # memory / VRAM. pi0_fast is FULL-finetuned (no LoRA) — FAST extends PaliGemma's
  # token vocabulary, so the action-token embeddings + LM head must train, which
  # attention-only LoRA would freeze. bf16 + grad checkpointing keep it feasible.
  dtype: "bfloat16"
  gradient_checkpointing: true

  # k-bit quantization of the FROZEN VLM: none | nf4 | int8. OFF by default because
  # the full finetune above is pi0_fast's native recipe. Enabling it necessarily
  # converts the run to QLoRA (a 4-bit base takes no gradient), so it REQUIRES
  # vlm_lora_rank > 0. lm_head and the token embeddings are never quantized, so the
  # FAST action tokens remain learnable either way.
  quantize: "none"
  vlm_lora_rank: 0        # >0 -> LoRA on the VLM q/k/v/o + frozen base (required by quantize)
  vlm_lora_alpha: 32
  vlm_lora_dropout: 0.05

  # proprioception handling — benchmark axis (see docs/proprioception_modes.md)
  #   full | dropout | none   (override: python common/train.py --policy pi0_fast --proprio none)
  proprio_mode: full
  proprio_dropout_rate: 0.3

training:
  batch_size: 4
  lr: 2.5e-5
  weight_decay: 0.01
  max_epochs: 100
  grad_clip: 1.0
  save_every: 10
  log_every: 50
  checkpoint_dir: "policies/pi0_fast/checkpoints"
  device: "cuda"
  seed: 42
