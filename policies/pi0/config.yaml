# π0 (pi0) — flow-matching VLA, full-scale config.
# ⚠️  REQUIRES PALIGEMMA WEIGHTS (~5 GB, gated HuggingFace download):
#     huggingface-cli login
#     # accept licence: https://huggingface.co/google/paligemma-3b-pt-224
# Run from repo root:
#     python common/train.py --policy pi0

dataset:
  root: "../so101-fr5-teleop/lerobot_dataset"
  chunk_size: 50          # pi0 default (1.67 s at 30 Hz)
  use_image: true
  camera_names: [wrist_cam, scene_cam]   # wrist + scene
  image_size: [224, 224]
  val_frac: 0.1
  aug_level: "crops"      # crops only — pi0 uses SigLIP norm internally

model:
  state_dim: 7
  action_dim: 7

  # π0 pretrained weights — REQUIRED for finetuning. lerobot's PI0Policy(config)
  # random-inits the whole 2.3B model; only from_pretrained downloads weights.
  # "lerobot/pi0_base" is the openpi port (~6 GB). Set null for smoke tests only.
  pretrained: "lerobot/pi0_base"

  # finetuning recipe: LoRA adapters (peft) on the frozen VLM's q/k/v/o projections
  # + FULL training of the 300M action expert & projections. rank 0 disables LoRA
  # (then freeze_vision_encoder / train_expert_only below decide what trains).
  vlm_lora_rank: 16
  vlm_lora_alpha: 32
  vlm_lora_dropout: 0.05
  # which VLM Linears get adapters — openpi LoRAs attention AND the MLP (rank 16 on
  # both in gemma_2b_lora); QLoRA finds all-linear adapters match full finetuning.
  # Older checkpoints (attention-only) rebuild correctly: their saved config has no
  # key, and the code default is q/k/v/o.
  vlm_lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

  # pi0 architecture (must match PaliGemma variant)
  paligemma_variant: "gemma_2b"
  action_expert_variant: "gemma_300m"
  max_state_dim: 32
  max_action_dim: 32
  tokenizer_max_length: 48

  # flow-matching inference
  num_inference_steps: 10
  # inference smoothing (no effect on training/weights; override at deploy via
  # deploy.py --n-action-steps). Execute the first k of each chunk then re-plan
  # (receding horizon); null = execute the whole chunk (most open-loop, jerkiest at
  # the ~1.67 s boundary). This is the right smoothing for the VLAs — NOT temporal
  # ensembling, which re-predicts every 33 ms step and blows the 30 Hz budget on a 2.3B VLM.
  n_action_steps: null

  # memory / VRAM (see notebooks/train_pi0_runpod.ipynb for per-GPU guidance):
  #   80 GB: full finetune as-is        48 GB: full w/ batch 2, or freeze_vision_encoder
  #   24 GB: train_expert_only: true (freeze VLM, train 300M expert + projections)
  dtype: "bfloat16"              # "float32" doubles VRAM; bf16 matches pi0's native training
  gradient_checkpointing: true   # ~20% slower, large activation-memory saving
  freeze_vision_encoder: false
  train_expert_only: false

  # k-bit quantization of the FROZEN VLM (QLoRA): none | nf4 | int8.
  # nf4 stores the 2B VLM as 4-bit normal-float (~4.6 GB -> ~1.4 GB) and dequantizes
  # to bf16 at matmul time, so speed is close to unquantized and the freed VRAM goes
  # into batch size. Requires vlm_lora_rank > 0 — 4-bit weights take no gradient, so
  # the adapters carry the whole VLM update. The action expert is never quantized.
  quantize: "none"

  # proprioception handling — benchmark axis (see docs/proprioception_modes.md)
  #   full | dropout | none   (override: python common/train.py --policy pi0 --proprio none)
  proprio_mode: full
  proprio_dropout_rate: 0.3

training:
  batch_size: 4           # pi0 is large — reduce if OOM
  lr: 2.5e-5
  weight_decay: 0.01
  max_epochs: 100
  grad_clip: 1.0
  save_every: 10
  log_every: 50
  checkpoint_dir: "policies/pi0/checkpoints"
  device: "cuda"          # pi0 requires CUDA — too large for CPU/MPS
  seed: 42
